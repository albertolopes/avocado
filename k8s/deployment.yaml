apiVersion: apps/v1
kind: Deployment
metadata:
  name: institucional
  namespace: institucional
spec:
  replicas: 1
  selector:
    matchLabels:
      app: institucional
  template:
    metadata:
      labels:
        app: institucional
    spec:
      imagePullSecrets:
        - name: gitlab-registry-credentials
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
